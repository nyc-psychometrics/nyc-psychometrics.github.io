name: Update courses

# Regenerates the _courses collection from the Google Form response sheet.
# The sheet is the source of truth; this keeps the site in sync with it without
# anyone having to remember to re-run the script.

on:
  schedule:
    - cron: "0 11 * * *" # daily, ~7am Eastern
  workflow_dispatch:

permissions:
  contents: write
  actions: write # needed to kick off the deploy workflow below

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Stdlib only, so there is nothing to install.
      - name: Fetch course submissions 📋
        run: python3 bin/fetch_courses.py

      - name: Commit changes 💾
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _courses _data/universities.yml
          if git diff --staged --quiet; then
            echo "No course changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update courses from submission form"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A push made with GITHUB_TOKEN does not trigger other workflows, so the
      # deploy has to be dispatched explicitly.
      - name: Trigger deploy 🚀
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref ${{ github.ref_name }}
